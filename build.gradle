plugins {
  id 'application'
  id 'com.diffplug.spotless' version '8.6.0'
}

group = 'com.fw.leetcode'
version = '0.0.1'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

dependencies {}

application {
  mainClass = 'com.fw.leetcode.Main'
}

spotless {
  java {
    googleJavaFormat()
  }
}
